risk_policy:
  version: "1.0.0"
  description: "Cost-sensitive financial risk policy parameters"

  error_costs:
    c_fn: 5.0  # Cost of False Negative (missed shortfall: fees, severe distress, default)
    c_fp: 1.0  # Cost of False Positive (unnecessary alert: user annoyance, fatigue)

  thresholds:
    default_shortfall_horizon_days: 7
    supported_horizons_days: [1, 3, 7, 14]
    bdt_minimum_safety_balance: 500.0
    usd_minimum_safety_balance: 50.0
    decision_threshold_analytic_prior: 0.1667  # C_FP / (C_FN + C_FP) = 1 / (5 + 1)
    high_risk_probability_threshold: 0.40
    critical_risk_probability_threshold: 0.70

  alert_budget:
    max_alerts_per_week: 3
    cooldown_hours_between_same_alert: 48

  cold_start:
    min_history_days_required: 14
    min_transactions_required: 10
    insufficient_history_status: "INSUFFICIENT_HISTORY"
    prior_shortfall_probability: 0.25

  drift_detection:
    psi_warning_threshold: 0.10
    psi_critical_threshold: 0.25
    adwin_delta: 0.002
